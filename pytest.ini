[pytest]
# The test_*.py files at the repo root are manual scripts (they open the GUI,
# enumerate audio devices or connect to a running API), not tests.
testpaths = tests
# If a test stalls, dump every thread's stack instead of hanging silently.
faulthandler_timeout = 120
# Capture at the Python level: fd-level capture (the default) intermittently
# breaks Tcl's start-up on Windows ("couldn't read file .../auto.tcl"), which
# made the GUI tests skip at random.
addopts = --capture=sys
